/* Floating active navigation: stable layout, animated lift and sliding pill. */
.nav{overflow:visible;padding-top:12px;min-height:76px;}
.nav button{position:relative;transition:color .22s ease;}
.nav button b{transform:translateY(0) scale(1);transition:transform .32s cubic-bezier(.18,.85,.28,1.22);will-change:transform;}
.nav button.active b{transform:translateY(-8px) scale(1.09);}
.nav button.active:active b{transform:translateY(-10px) scale(1.03);}
.nav button:not(.active):active b{transform:translateY(-3px) scale(.96);}
.nav-indicator{top:5px;height:34px;transition:transform .32s cubic-bezier(.2,.78,.22,1);}
.nav-indicator:before{height:34px;width:min(56px,90%);box-shadow:0 4px 9px #075bc71c;border:1px solid #075bc710;}
@media(prefers-reduced-motion:reduce){.nav button b,.nav-indicator{transition:none!important;}}

/* V4: unified rounded icon system and raised Material-style active destination. */

function welcome(){const intro=`<img class="biglogo" src="${logo}" alt="LOHWS logo"><h1>LOHWS</h1><div class="caption">Light of Human Welfare Society</div><div class="sub">Together for a Better Tomorrow...</div>`;if(stage==='welcome')return `<div class="onboard">${intro}<img class="heroimg" src="${heart}" alt="Hands holding a heart"><h2>Welcome to LOHWS</h2><p>Together we can make a difference.</p>${b('Get Started →',"onboard('roles')",'primary full')}${b('Already have an account? Login',"onboard('login')",'link')}</div>`;if(stage==='roles')return `<div class="onboard">${intro}<h2>Select your role</h2><p>Choose how you want to join.</p><div class="rolehint">Tip: role card par tap karte hi us panel ka dashboard khul jayega.</div>${Object.entries(panels).map(([k,v])=>`<button class="card row link rolechoice ${chosen===k?'selected':''} ${k==='DON'?'don':k==='NGO'?'ngo':k==='REQ'?'req':'adm'}" onclick="chosen='${k}';switchRole('${k}')"><span class="tile">${ico({DON:'heart',NGO:'building',REQ:'helping',ADM:'shield'}[k])}</span><div class="body"><h3>${v}</h3><span class="small">${{DON:'Support with donations',NGO:'Manage your organization',REQ:'Request assistance',ADM:'Govern the platform'}[k]}</span></div></button>`).join('')}${b('Continue with selected role →',"switchRole(chosen)",'primary full')}${b('Sign in',"onboard('login')",'link')}</div>`;return `<div class="onboard">${intro}<h2>${stage==='register'?'Create your account':'Login to your account'}</h2>${form('login',select('role','Select role',Object.values(panels),panels[chosen])+(stage==='register'?field('name','Full name','Demo User'):'')+field('email','Email address','demo@example.com','email')+field('pw','Demo password','demo123','password')+`<div class="notice">Fictional credentials only. No real account is created.</div>`,stage==='register'?'Register (demo)':'Login (demo)')}${b(stage==='register'?'Already registered? Login':'Create account',stage==='register'?"onboard('login')":"onboard('register')",'link')}$ function dashboard(){let confirmed=db.donations.filter(d=>['SUCCEEDED','SETTLED'].includes(d.payment)).reduce((s,d)=>s+d.amount,0);if(role==='DON')return `<div class="toplabel">Together for a Better Tomorrow</div>${heading('Hello, Rahul 👋','Every act of kindness makes a difference.')}<div class="hero"><div class="saas-hero-art" aria-hidden="true">${ico('handheart')}</div><div class="copy"><div class="small" style="color:white">Make an impact</div><h2>Donate Today.<br>Change a Life.</h2>${b('Donate Now →',"go('DON-02')")}</div></div><div class="stats">${stat('Total donations',money(25000+confirmed))}${stat('Active sponsorships',db.sponsors.filter(s=>s.status==='ACTIVE').length)}</div>${section('Quick actions')}${shortcuts(['DON-04','DON-02','DON-06','DON-07'])}${section('Verified needs','DON-02')}${publicNeeds().slice(0,2).map(n=>needCard(n,true)).join('')}${section('Our impact','DON-09')}<div class="stats">${stat('People helped · sample','1,000+')}${stat('NGO partners · sample','50+')}</div>`;if(role==='NGO')return heading('NGO dashboard','Hope Foundation · '+staffRole)+`<div class="stats">${stat('Campaigns',db.campaigns.length)}${stat('Pending reviews',db.needs.filter(n=>!['PUBLISHED','FULFILLED','CLOSED'].includes(n.status)).length)}</div>${card(`<span class="small">Donations received · demo</span><h1>${money(250000+confirmed)}</h1><div class="bars">${[20,31,44,40,58,68,88].map(x=>`<i style="height:${x}%"></i>`).join('')}</div>`)}${section('Quick actions')}${shortcuts(['NGO-05','NGO-06','NGO-07','NGO-08','NGO-09','NGO-12'])}${section('Operational queues','NGO-05')}${db.needs.filter(n=>n.status==='SUBMITTED').map(n=>needCard(n)).join('')}`;if(role==='ADM')return heading('Platform dashboard','Governance and risk monitoring · demo')+`<div class="stats">${stat('NGO partners',db.ngos.length)}${stat('Review queue',db.ngos.filter(n=>n.status==='SUBMITTED').length)}${stat('Requirements',db.needs.length)}${stat('Open cases',db.cases.filter(c=>c.status!=='RESOLVED').length)}</div>${section('Quick actions')}${shortcuts(['ADM-02','ADM-07'])}${card('<h3>Platform health · simulated</h3>'+pill('ACTIVE')+'<p>No live services are connected.</p>')}`;return heading('My requirements','Track your requests and assistance')+`<div class="stats">${stat('Submitted',db.needs.length)}${stat('Published',publicNeeds().length)}</div>${section('Quick actions')}${shortcuts(['REQ-03','REQ-08','REQ-05','REQ-07'])}${section('Your requests')}${list(db.needs,n=>needCard(n)+ (n.status==='DRAFT'?b('Submit draft',`needAct(${n.id},'submit')`):''))}`}
function needForm(emergency=false){return form(emergency?'emergency':'need',field('title','Requirement title')+select('category','Category',['Education','Food','Medical','Shelter','Other'])+select('type','Assistance type',['Money','Goods','Combined'])+field('amount','Budget / target amount (INR)',1000,'number')+field('items','Item description','', 'text',false)+field('quantity','Quantity',1,'number')+field('count','Beneficiary count',1,'number')+field('city','Location / city','Bhopal')+select('urgency','Urgency',emergency?['Emergency']:['Normal','High','Emergency'])+ta('description','Need description')+filefield('evidence','Private evidence')+check('consent','Consent to private verification and minimized public listing',false,true)+check('draft','Save as draft instead of submitting')+ (emergency?'<div class="notice">This demo is not an emergency response service; all urgent requests still require review.</div>':''),'Save requirement')}
function reviewNeeds(){return `<div class="notice">Verifier and approver are separate demo identities. Privacy and NGO eligibility are required before publication.</div>${select('staff','Act as',['Verifier','Approver'],staffRole).replace('<select name="staff">','<select name="staff" onchange="staffRole=this.value;render()">')}${list(db.needs,n=>needCard(n)+card(`<div class="small">Private evidence: ${esc(n.evidence||'Sample evidence')} · consent ${n.consent?'recorded':'missing'}</div>${n.reason?`<p>${esc(n.reason)}</p>`:''}<div class="actions">${staffRole==='Verifier'&&['SUBMITTED','UNDER_REVIEW','FIELD_VERIFICATION'].includes(n.status)?b('Assign / review',`needAct(${n.id},'review')`,'secondary')+b('Request clarification',`needAct(${n.id},'clarify')`,'secondary')+b('Field verification',`needAct(${n.id},'field')`,'secondary')+b('Record findings',`needAct(${n.id},'verify')`,'success'):''}${staffRole==='Approver'&&n.verified&&n.status==='UNDER_REVIEW'?b('Approve',`needAct(${n.id},'approve')`,'success')+b('Reject with reason',`needAct(${n.id},'reject')`,'danger'):''}${staffRole==='Approver'&&n.status==='APPROVED'?b('Privacy review & publish',`needAct(${n.id},'publish')`,'success'):''}</div><div class="timeline">${(n.history||[]).slice(-4).map(s=>`<div>✓ ${esc(s)}</div>`).join('')}</div>`))}`}
function needAct(i,a){let n=db.needs.find(x=>x.id===i);if(!n)return;let next='',reason='';if(role==='REQ'&&a==='submit'&&n.status==='DRAFT')next='SUBMITTED';if(role==='NGO'&&staffRole==='Verifier'&&['SUBMITTED','UNDER_REVIEW','FIELD_VERIFICATION'].includes(n.status)){if(a==='review')next='UNDER_REVIEW';if(a==='clarify'){reason=prompt('What additional evidence is required?')||'';if(reason.trim())next='CLARIFICATION_REQUIRED'}if(a==='field')next='FIELD_VERIFICATION';if(a==='verify'){reason=prompt('Record demo verification findings','Eligibility and evidence checked')||'';if(reason.trim()){n.verified=true;next='UNDER_REVIEW'}}}if(role==='NGO'&&staffRole==='Approver'&&n.verified&&n.status==='UNDER_REVIEW'){if(a==='approve')next='APPROVED';if(a==='reject'){reason=prompt('Required rejection reason')||'';if(reason.trim())next='REJECTED'}}if(role==='NGO'&&staffRole==='Approver'&&a==='publish'&&n.status==='APPROVED'&&n.consent&&db.ngos[0].status==='ACTIVE'){if(confirm('Confirm public listing is minimized and consented?'))next='PUBLISHED'}if(role==='ADM'&&a==='freeze'&&['PUBLISHED','PARTIALLY_FULFILLED'].includes(n.status)){reason=prompt('Escalation reason')||'';if(reason.trim())next='SUSPENDED'}if(role==='ADM'&&a==='clear'&&n.status==='SUSPENDED'&&db.ngos[0].status==='ACTIVE'){reason=prompt('Clearance reason')||'';if(reason.trim())next='PUBLISHED'}if(!next)return toast('Transition not permitted or reason missing');n.status=next;n.reason=reason;n.history.push(next);log(n.title+' → '+next)}
function donationList(mode){return list(db.donations,d=>card(`<h3>${money(d.amount)} · ${esc(getNeed(d.need).title)}</h3><span class="small">DEMO-${d.id}</span>${statusBlock(d)}<div class="actions">${mode==='donor'?lohPaymentActions(d):''}${mode==='donor'&&['SUCCEEDED','SETTLED','PARTIALLY_REFUNDED','REFUNDED'].includes(d.payment)?b('Demo receipt',`receipt(${d.id})`,'secondary'):''}${mode==='ngo'&&d.payment==='SUCCEEDED'?b('Reconcile settlement',`donAct(${d.id},'settle')`,'secondary'):''}${mode==='ngo'&&d.payment==='SETTLED'&&['NOT_PROPOSED','REVERSED'].includes(d.allocation)?b('Propose allocation',`donAct(${d.id},'propose')`):''}${mode==='ngo'&&d.allocation==='PROPOSED'?b('Approve allocation',`donAct(${d.id},'approve')`):''}${mode==='ngo'&&d.allocation==='APPROVED'?b('Post allocation',`donAct(${d.id},'post')`,'success'):''}${mode==='ngo'&&d.allocation==='POSTED'&&['NOT_REPORTED','REJECTED'].includes(d.utilization)?b('Submit utilization evidence',`donAct(${d.id},'evidence')`):''}${mode==='ngo'&&d.utilization==='EVIDENCE_SUBMITTED'?b('Review evidence',`donAct(${d.id},'review')`):''}${mode==='ngo'&&d.utilization==='REVIEWED'?b('Accept evidence',`donAct(${d.id},'accept')`,'success')+b('Reject evidence',`donAct(${d.id},'reject')`,'danger'):''}${mode==='admin'&&['SUCCEEDED','SETTLED'].includes(d.payment)&&d.allocation==='NOT_PROPOSED'?b('Open refund case',`donAct(${d.id},'refund')`,'secondary'):''}${mode==='admin'&&d.payment==='REFUND_PENDING'?b('Simulate provider refund',`donAct(${d.id},'refunded')`,'secondary'):''}</div>${d.evidence&&d.utilization==='ACCEPTED'?`<p class="small">Privacy-safe impact: ${esc(d.evidence)}</p>`:''}`))}function donAct(i,a){let d=db.donations.find(x=>x.id===i);if(!d)return;let n=getNeed(d.need);if(role==='NGO'){if(a==='settle'&&d.payment==='SUCCEEDED')d.payment='SETTLED';else if(a==='propose'&&d.payment==='SETTLED'&&['NOT_PROPOSED','REVERSED'].includes(d.allocation))d.allocation='PROPOSED';else if(a==='approve'&&d.allocation==='PROPOSED')d.allocation='APPROVED';else if(a==='post'&&d.allocation==='APPROVED'){d.allocation='POSTED';d.donation='ALLOCATED';(db.ledger||=[]).push({donation:d.id,amount:d.amount,at:new Date().toISOString()})}else if(a==='evidence'&&d.allocation==='POSTED'){let s=prompt('Enter fictional, privacy-safe utilization evidence');if(!s?.trim())return;d.evidence=s;d.utilization='EVIDENCE_SUBMITTED'}else if(a==='review'&&d.utilization==='EVIDENCE_SUBMITTED')d.utilization='REVIEWED';else if(a==='accept'&&d.utilization==='REVIEWED'){d.utilization='ACCEPTED';if(n.status==='PUBLISHED')n.status='PARTIALLY_FULFILLED';n.history.push(n.status)}else if(a==='reject'&&d.utilization==='REVIEWED'){if(!prompt('Rejection reason'))return;d.utilization='REJECTED'}else return toast('Action not permitted')}else if(role==='ADM'&&a==='refund'&&d.allocation==='NOT_PROPOSED'&&['SUCCEEDED','SETTLED'].includes(d.payment)){if(!prompt('Refund investigation reason'))return;d.payment='REFUND_PENDING'}else if(role==='ADM'&&a==='refunded'&&d.payment==='REFUND_PENDING'){d.payment='REFUNDED';n.raised=Math.max(0,n.raised-d.amount)}else return toast('Action not permitted');log('Demo financial event: '+a)}function receipt(i){let d=db.donations.find(x=>x.id===i);alert('LOHWS DEMO RECEIPT\n'+money(d.amount)+'\nReference: DEMO-'+i+'\nPayment: '+d.payment+'\nNot a valid tax receipt. No real money moved.')}function paymentConfirm(i,outcome){let d=db.donations.find(x=>x.id===i);if(role!=='DON'||d.payment!=='PROCESSING')return;d.payment=outcome;if(outcome==='SUCCEEDED'){d.donation='CONFIRMED';getNeed(d.need).raised+=d.amount}else{d.donation=outcome==='CANCELLED'?'CANCELLED':'PENDING_PAYMENT'}log('Simulated provider event: '+outcome);go('DON-08')}
function goodsList(mode){return list(db.goods,g=>card(`<h3>${esc(g.item)} × ${g.qty} ${esc(g.unit)}</h3><p class="small">${esc(g.condition)} · ${esc(g.method)} · ${esc(g.date)}</p>${pill(g.status)}<div class="statuses"><div><small>Accepted quantity</small><b>${g.accepted||0}</b></div><div><small>Stock available</small><b>${g.status==='AVAILABLE'?g.accepted:0}</b></div></div><div class="actions">${mode==='inventory'&&g.status==='SUBMITTED'?b('Accept pledge',`goodsAct(${g.id},'accept')`)+b('Decline',`goodsAct(${g.id},'decline')`,'danger'):''}${mode==='inventory'&&['PICKUP_SCHEDULED','DROPOFF_EXPECTED'].includes(g.status)?b('Record goods receipt',`goodsAct(${g.id},'receive')`):''}${mode==='inventory'&&g.status==='INSPECTION_PENDING'?b('Inspect / accept quantity',`goodsAct(${g.id},'inspect')`,'success'):''}${mode==='inventory'&&g.status==='AVAILABLE'?b('Quarantine',`goodsAct(${g.id},'quarantine')`,'secondary')+b('Record loss / expiry',`goodsAct(${g.id},'loss')`,'danger'):''}${mode==='distribution'&&g.status==='AVAILABLE'?b('Reserve for requirement',`goodsAct(${g.id},'reserve')`):''}${mode==='distribution'&&g.status==='RESERVED'?b('Dispatch',`goodsAct(${g.id},'dispatch')`):''}${mode==='distribution'&&g.status==='DISPATCHED'?b('Record delivery proof',`goodsAct(${g.id},'deliver')`,'success'):''}${mode==='recipient'&&g.status==='DELIVERED'?b('Acknowledge receipt',`goodsAct(${g.id},'ack')`,'success'):''}</div>`))}function goodsAct(i,a){let g=db.goods.find(x=>x.id===i),s=g.status,n='';if(role==='NGO'){if(s==='SUBMITTED'&&a==='accept')n=g.method==='Pickup'?'PICKUP_SCHEDULED':'DROPOFF_EXPECTED';if(s==='SUBMITTED'&&a==='decline'&&prompt('Decline reason'))n='NGO_DECLINED';if(['PICKUP_SCHEDULED','DROPOFF_EXPECTED'].includes(s)&&a==='receive')n='INSPECTION_PENDING';if(s==='INSPECTION_PENDING'&&a==='inspect'){let raw=prompt('Accepted quantity (0–'+g.qty+')',g.qty);if(raw===null)return;let q=Number(raw);if(!Number.isInteger(q)||q<0||q>g.qty)return toast('Invalid quantity');if(q<g.qty&&!prompt('Reason for rejected quantity'))return;g.accepted=q;n=q?'AVAILABLE':'REJECTED'}if(s==='AVAILABLE'&&a==='reserve'){if(!publicNeeds().length)return toast('No published requirement');n='RESERVED'}if(s==='AVAILABLE'&&a==='quarantine'&&prompt('Quarantine reason'))n='QUARANTINED';if(s==='AVAILABLE'&&a==='loss'&&prompt('Loss or expiry reason'))n='LOST';if(s==='RESERVED'&&a==='dispatch')n='DISPATCHED';if(s==='DISPATCHED'&&a==='deliver'&&prompt('Demo delivery proof / reference'))n='DELIVERED'}if(role==='REQ'&&s==='DELIVERED'&&a==='ack')n='ACKNOWLEDGED';if(!n)return toast('Action not permitted or missing reason');g.status=n;log('Goods '+g.item+' → '+n)}
function sponsors(mode){return list(db.sponsors,s=>card(`<h3>${esc(s.cause)}</h3><p>${money(s.amount)} / ${esc(s.frequency)} · ${esc(s.duration)} months</p>${pill(s.status)}<div class="statusrow small"><span>Next instalment</span>${pill(s.installment)}</div><div class="actions">${mode==='donor'&&s.status==='PENDING_PAYMENT'?b('Simulate verified payment',`spAct(${s.id},'activate')`,'success'):''}${mode==='donor'&&s.status==='ACTIVE'?b('Pause',`spAct(${s.id},'pause')`,'secondary')+b('Pay next instalment',`spAct(${s.id},'pay')`)+b('Simulate failed instalment',`spAct(${s.id},'fail')`,'secondary'):''}${mode==='donor'&&s.status==='PAYMENT_RETRY'?b('Retry payment',`spAct(${s.id},'retry')`):''}${mode==='donor'&&s.status==='PAUSED'?b('Resume',`spAct(${s.id},'resume')`):''}${mode==='donor'&&!['CANCELLED','CANCELLATION_REQUESTED'].includes(s.status)?b('Request cancellation',`spAct(${s.id},'cancel')`,'secondary'):''}${mode==='ngo'&&s.status==='CANCELLATION_REQUESTED'?b('Confirm cancellation',`spAct(${s.id},'confirm')`,'danger'):''}${mode==='ngo'&&s.status==='ACTIVE'?b('Publish privacy-safe update',`spAct(${s.id},'update')`):''}</div>${s.update?`<p>${esc(s.update)}</p>`:''}`))}function spAct(i,a){let s=db.sponsors.find(x=>x.id===i);if(role==='DON'){if(a==='activate'&&s.status==='PENDING_PAYMENT'){s.status='ACTIVE';s.installment='DUE'}else if(a==='pause'&&s.status==='ACTIVE')s.status='PAUSED';else if(a==='resume'&&s.status==='PAUSED')s.status='ACTIVE';else if(a==='pay'&&s.status==='ACTIVE')s.installment='PAID';else if(a==='fail'&&s.status==='ACTIVE'){s.installment='FAILED';s.status='PAYMENT_RETRY'}else if(a==='retry'&&s.status==='PAYMENT_RETRY'){s.status='ACTIVE';s.installment='PAID'}else if(a==='cancel'&&!['CANCELLED','CANCELLATION_REQUESTED'].includes(s.status))s.status='CANCELLATION_REQUESTED';else return}else if(role==='NGO'&&a==='confirm'&&s.status==='CANCELLATION_REQUESTED')s.status='CANCELLED';else if(role==='NGO'&&a==='update'&&s.status==='ACTIVE'){let m=prompt('Privacy-s function solidOrangeColor(v){let m=String(v).match(/#[0-9a-f]{6}|rgba?\([^)]*\)/i);if(!m)return false;let a=m[0].startsWith('#')?m[0].slice(1).match(/../g).map(x=>parseInt(x,16)):m[0].match(/[\d.]+/g).map(Number);if(a.length<3||a.length>3&&a[3]<.97)return false;let [r,g,b]=a;return r>=120&&r>g*1.15&&g>b*1.35&&r-b>=68&&g<205&&b<130&&g/r>=.20;}

function markOrangeFills(){orangeFrame=0;let a=$('app');if(!a)return;let candidates=a.querySelectorAll('button,.tile,.saas-stat-icon,.shortcut b,.badge-dot,.pill,.theme-primary,.theme-secondary,.theme-preview-active,.screen-intro');for(let el of candidates){let bg=getComputedStyle(el).backgroundColor;el.classList.toggle('orange-filled',solidOrangeColor(bg));}}

const liftPending=new WeakSet(),liftReplay=new WeakSet();
document.addEventListener('click',function(e){
 const b=e.target.closest?.('#app .exact-tools button,#app .fe-entry button');
 if(!b||b.disabled||liftReplay.has(b)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 e.preventDefault();e.stopImmediatePropagation();if(liftPending.has(b))return;
 liftPending.add(b);b.classList.add('real-lift');
 setTimeout(()=>{liftPending.delete(b);if(!b.isConnected)return;liftReplay.add(b);try{b.click()}finally{liftReplay.delete(b);b.classList.remove('real-lift')}},170);

#app .onboard button.primary{background:linear-gradient(180deg,#126cda,#0355bc)!important;color:#fff!important;border-radius:100px!important;min-height:49px!important;box-shadow:0 4px 10px #0656bc20!important}
#app .onboard button.link{color:#075bc7!important}
#app header{position:sticky!important;top:0;background:#fff!important;color:#16243c!important;box-shadow:none!important;border-radius:0!important;border-bottom:1px solid #edf2f7!important;min-height:64px!important;padding:12px 15px!important;gap:9px!important}
#app header .logo{width:38px!important;height:38px!important;border-radius:50%!important;background:#e6eef9!important}
#app header .brand,#app header .brand small{color:#16243c!important;-webkit-text-fill-color:#16243c!important}
#app header .brand{font-size:17px!important;letter-spacing:-.3px!important}
#app header .brand small{font-size:10px!important;color:#627289!important;-webkit-text-fill-color:#627289!important}
#app header button{background:#f3f7fb!important;color:#183f61!important;border:1px solid #e9eff6!important;border-radius:50%!important;width:38px!important;min-width:38px!important;height:38px!important}
#app header button .icon-svg,#app header button svg{color:#214564!important}
#app .switch{border-color:#eff3f8!important;background:#fff!important}
#app .nav{max-width:490px!important;border:1px solid #e5edf4!important;border-bottom:0!important;background:#fff!important;border-radius:19px 19px 0 0!important;box-shadow:0 -4px 18px #174c7216!important;padding:10px 2px max(10px,env(safe-area-inset-bottom))!important}
#app .nav button{font-size:10px!important;color:#657488!important;min-width:0!important;flex:1 1 0!important;gap:3px!important;padding:0 2px!important}
#app .nav button b{height:39px!important;width:39px!important;border-radius:50%!important;display:grid!important;place-items:center!important;margin:0 auto!important;line-height:1!important;background:transparent!important;color:#63778d!important;transform:none!important}
#app .nav button.active b{background:#0762cf!important;color:white!important;box-shadow:0 4px 11px #075bc74a!important}
#app .nav button.active{color:#075bc7!important}
#app .nav button b svg{width:22px!important;height:22px!important;color:inherit!important;stroke:currentColor!important}
#app .lohp-welcome{margin:5px 0 15px}.lohp-welcome h1{font-size:21px!important;font-weight:800;margin:0 0 2px!important}.lohp-welcome p{margin:0!important;font-size:12px!important}
#app .lohp-hero{position:relative;overflow:hidden;min-height:177px;border-radius:18px;background:#12603c;margin:5px 0 17px;box-shadow:0 6px 17px #1f76432b}
#app .lohp-hero img{position:absolute;inset:0 0 0 auto;width:64%;height:100%;object-fit:cover;mask-image:linear-gradient(90deg,transparent,#000 32%)}
#app .lohp-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(7,83,49,.94),rgba(19,107,54,.68) 50%,transparent 74%);z-index:1}
#app .lohp-hero .lohp-hero-copy{position:relative;z-index:2;color:#fff;width:67%;padding:22px 0 18px 18px}
#app .lohp-hero h2{font-size:22px!important;line-height:1.1!important;color:white!important;margin:0 0 8px!important}
#app .lohp-hero p{font-size:11px!important;line-height:1.4;color:#f1fff4!important;margin-bottom:12px!important}
#app .lohp-hero button{min-height:35px!important;padding:8px 14px!important;background:white!important;color:#184b34!important;-webkit-text-fill-color:#184b34!important;border:0!important;border-radius:100px!important;box-shadow:none!important;font-size:11px!important;font-weight:800!important}
#app .lohp-section-heading{font-size:16px!important;font-weight:800;margin:20px 0 10px!important;color:#1c2940!important;display:flex;justify-content:space-between;align-items:center}
#app .lohp-impact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#app .lohp-impact-item{border:1px solid #e6edf3;border-radius:15px;background:white;padding:12px 5px 10px;text-align:center;min-height:109px;box-shadow:0 3px 12px #173b610c}
#app .lohp-impact-item svg{width:23px;height:23px;color:#159450;margin-bottom:5px}
#app .lohp-impact-item strong{display:block;font-size:17px;color:#14263b;line-height:1.2}
#app .lohp-impact-item span{font-size:10px;color:#66798a}
#app .lohp-donation-line{display:flex;align-items:center;gap:11px;border-bottom:1px solid #edf2f7;padding:12px 0}
#app .lohp-donation-line:last-child{border-bottom:0}
#app .lohp-icon{width:40px;height:40px;border-radius:12px;background:#e6f5ed;color:#16974f;display:grid;place-items:center;flex:none}
#app .lohp-icon svg{width:21px;height:21px}
#app .lohp-donation-line strong{display:block;font-size:12px}
#app .lohp-donation-line small{display:block;color:#7b8997;font-size:10px;margin-top:3px}
#app .lohp-donation-line em{margin-left:auto;color:#118449;font-size:12px;font-weight:800;font-style:normal}
#app .lohp-featured{display:flex;align-items:center;gap:11px;padding:10px!important}
#app .lohp-featured img{width:78px;height:74px;object-fit:cover;border-radius:11px;flex:none}
#app .lohp-featured h3{font-size:12px!important;margin:0 0 4px!important}
#app .lohp-featured p{font-size:11px!important;margin:0 0 8px!important}
#app .lohp-featured .progress{margin:4px 0 6px!important;height:6px!important}
#app .lohp-featured .progress i{background:#178e4d!important}
#app .lohp-accordion{margin-top:20px;border:1px solid #dbe8f2;border-radius:14px;background:#fff;overflow:hidden}
#app .lohp-accordion summary{padding:15px 14px;font-weight:800;color:#095cbf;cursor:pointer}
#app .lohp-accordion .lohp-original{padding:12px 12px 16px}
#app .lohp-notif-filter{display:flex;gap:6px;margin:10px 0 15px;overflow-x:auto}
#app .lohp-notif-filter button{flex:1;min-width:max-content;border:0;border-radius:100px;padding:8px 12px;background:#edf3f9;color:#485b72;font-size:11px;font-weight:700}
#app .lohp-notif-filter button[aria-pressed=true]{background:#148654!important;color:#fff!important}
#app .lohp-notification-card{display:flex;gap:12px;padding:15px 12px!important;margin:10px 0!important;border-radius:17px!important;align-items:flex-start}
#app .lohp-notification-card .lohp-icon{height:41px;width:41px}
#app .lohp-notification-card strong{font-size:12px;color:#19283b}
#app .lohp-notification-card p{font-size:11px!important;color:#4d6074!important;line-height:1.5;margin:5px 0!important}
#app .lohp-notification-card small{font-size:10px;color:#8a9aa9}
#app .lohp-notification-card button{border:0;background:none;font-size:11px;color:#0862bf;font-weight:800;margin:6px 0 0;padding:0}
#app .v9pick button{overflow-wrap:normal;word-break:normal;min-width:0!important}

  function trH(en,hi){return typeof v6lang!=='undefined'&&v6lang==='Hindi'?hi:en}
  function imgSafe(v){return typeof v==='string'&&v.startsWith('data:')?v:''}
  function humanTouch(){
    const root=document.getElementById('app');if(!root)return;
    if(stage==='welcome'){
      const onboard=root.querySelector('.onboard');
      if(onboard){const h=onboard.querySelector('h2');if(h)h.textContent=trH('Welcome to LOHWS','LOHWS में स्वागत है');}
      return;
    }
    if(stage==='roles'){
      root.querySelectorAll('.rolechoice').forEach(btn=>{
        let ico=btn.querySelector('.tile');if(ico)ico.style.boxShadow='none';
      });return;
    }
    if(stage!=='app')return;
    const main=root.querySelector('main');if(!main)return;
    if(page===homeKey() && role==='DON'){
      const top=document.createElement('div');top.className='lohp-real-dashboard';
      const successful=db.donations.filter(d=>['SUCCEEDED','SETTLED'].includes(d.payment));
      const count=successful.length;
      const realDonations=db.donations.slice(0,3);
      let rowHtml=realDonations.length?realDonations.map(d=>{
        const n=db.needs.find(x=>x.id===d.need);return `<div class="lohp-donation-line"><span class="lohp-icon">${ico('heart')}</span><div><strong>${esc(n?.title||'Donation')}</strong><small>${esc(d.payment||'Demo payment')}</small></div><em>${money(d.amount)}</em></div>`;
      }).join(''):`<div class="lohp-donation-line"><span class="lohp-icon">${ico('heart')}</span><div><strong>${trH('Your giving history will appear here','आपके दान का इतिहास यहाँ दिखेगा')}</strong><small>${trH('Start with a demo donation','डेमो दान से शुरुआत करें')}</small></div></div>`;
      const cg=db.campaigns[0];const percentage=Math.min(100,Math.round((cg?.raised||0)/Math.max(1,cg?.goal||1)*100));
      top.innerHTML=`<div class="lohp-welcome"><h1>${trH('Hello, Rahul 👋','नमस्ते, राहुल 👋')}</h1><p>${trH('Together for a Better Tomorrow','एक बेहतर कल के लिए साथ')}</p></div>

<script id="loh-profile-editor-v2">
(function(){
  const K='lohws-editable-profiles-v2';
  const pencil='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m4 20 4.7-1.1L20 7.7 16.3 4 5 15.3 4 20Z"/><path d="m14.6 5.7 3.7 3.7"/></svg>';
  function all(){try {return JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){return {}}}
  function get(){return all()[role]||{}}
  function update(data){try{const a=all();a[role]=data;localStorage.setItem(K,JSON.stringify(a));return true}catch(e){return false}}
  function enhance(){
    if(typeof stage==='undefined'||stage!=='app')return;
    const card=document.querySelector('#app .reference-profile');if(!card)return;
    const d=get(),orig=card.querySelector('img');
    if(!orig)return;
    const photo=d.photo||orig.src;
    const name=d.name||'Demo User';
    const title=(typeof panels!=='undefined'&&panels[role])||'User';
    card.innerHTML='<div class="loh-profile-photo-wrap"><img alt="Profile photo"><button type="button" class="loh-photo-edit" aria-label="Change profile picture" title="Change profile picture">'+pencil+'</button></div><h2></h2><p></p><div class="loh-profile-meta"></div><button type="button" class="loh-profile-edit-btn">'+pencil+' Edit Profile</button>';
    card.querySelector('img').src=photo;
    card.querySelector('h2').textContent=name;
    card.querySelector('p').textContent=title;
    card.querySelector('.loh-profile-meta').textContent=[d.city,d.email].filter(Boolean).join(' · ');
    card.querySelector('.loh-profile-edit-btn').onclick=()=>openEditor();
    card.querySelector('.loh-photo-edit').onclick=()=>openEditor(true);
  }
  let draftPhoto;
  function openEditor(focusPhoto){
    document.querySelector('.loh-profile-dialog')?.remove();
    const d=get(),existing=document.querySelector('#app .reference-profile img');draftPhoto=d.photo||existing?.src||'';
    const dialog=document.createElement('dialog');dialog.className='loh-profile-dialog';
    dialog.innerHTML='<form method="dialog"><h2>Edit Profile</h2><p class="hint">Change your demo profile details. They stay in this browser.</p><img class="photo-preview" alt="Selected profile image"><label>Profile photo<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label><label>Full name<input name="name" required maxlength="60" placeholder="Enter your name"></label><label>Email address<input name="email" type="email" maxlength="100" placeholder="you@example.com"></label><label>Phone number<input name="phone" type="tel" inputmode="tel" maxlength="16" placeholder="Mobile number"></label><label>City<input name="city" maxlength="60" placeholder="Your city"></label><p class="hint" data-error role="alert"></p><div class="dialog-actions"><button type="button" data-cancel>Cancel</button><button type="submit">Save Changes</button></div></form>';
    document.body.append(dialog);
    const form=dialog.querySelector('form');
    form.elements.name.value=d.name||'Demo User';form.elements.email.value=d.email||'';form.elements.phone.value=d.phone||'';form.elements.city.value=d.city||'';
    const preview=dialog.querySelector('.photo-preview');preview.src=draftPhoto;
    form.elements.photo.addEventListener('change',e=>{
      const file=e.target.files?.[0];if(!file)return;
      const error=dialog.querySelector('[data-error]');error.textContent='';
      if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>1024*1024){error.textContent='Please select a JPG, PNG, or WebP image smaller than 1 MB.';e.target.value='';return}
      const reader=new FileReader();reader.onload=()=>{draftPhoto=reader.result;preview.src=draftPhoto};reader.onerror=()=>{error.textContent='Photo could not be loaded.'};reader.readAsDataURL(file);
    });
    form.querySelector('[data-cancel]').onclick=()=>dialog.close();
    form.addEventListener('submit',e=>{
      e.preventDefault();
      if(!form.reportValidity())return;
      const data={name:form.elements.name.value.trim(),email:form.elements.email.value.trim(),phone:form.elements.phone.value.trim(),city:form.elements.city.value.trim()};
      if(draftPhoto)data.photo=draftPhoto;
      if(!update(data)){dialog.querySelector('[data-error]').textContent='Could not save. Try a smaller profile photo or check browser storage.';return}
      dialog.close();enhance();
      if(typeof toast==='function')toast('Profile changes saved');
    });
    dialog.addEventListener('close',()=>dialog.remove(),{once:true});
    dialog.showModal();
    if(focusPhoto)form.elements.photo.focus();
  }
  const previousRender=render;
  render=function(){previousRender();enhance()};
  enhance();
  window.lohOpenProfileEditor=openEditor;
})();

(()=>{
function applyApprovedDesign(){
 const app=document.getElementById('app');if(!app||typeof stage==='undefined')return;
 const board=app.querySelector('.ref-onboard');
 if(stage==='roles'&&board){
   if(!board.querySelector('.lohw-role-grid')){
    const cards=[...board.querySelectorAll('.rolechoice')];
    if(cards.length===4){const grid=document.createElement('div');grid.className='lohw-role-grid';cards[0].before(grid);cards.forEach(c=>grid.append(c));}
   }
   const heading=board.querySelector('.ref-role-heading h2');if(heading)heading.textContent='Choose Your Role';
   const hint=board.querySelector('.ref-role-heading p');if(hint)hint.textContent='How would you like to make an impact?';
 }
 if(stage==='welcome'&&board&&!board.classList.contains('lohw-welcome')){
   board.classList.add('lohw-welcome');
   const photoTop=board.querySelector('.ref-welcome-photo');
   if(photoTop){
     const brandBox=document.createElement('section');brandBox.className='lohw-identity';
     const logoSrc=typeof logo==='string'?logo:'';
     brandBox.innerHTML=`${logoSrc?`<img src="${logoSrc}" alt="LOHWS logo">`:''}<h1>LOHWS</h1><p>Light of Human Welfare Society</p>`;
     photoTop.before(brandBox);
   }

   const logoNode=board.querySelector('.biglogo'),head=board.querySelector('h1'),caption=board.querySelector('.caption');
   if((logoNode||head)&&!board.querySelector('.lohw-identity')){const identity=document.createElement('section');identity.className='lohw-welcome-logo';
     if(logoNode)identity.append(logoNode);if(head)identity.append(head);if(caption)identity.append(caption);
     const trg=board.querySelector('.palette-trigger');if(trg)trg.after(identity);else board.prepend(identity);
   }
   const currentHero=board.querySelector('img.heroimg');
   if(currentHero){let frame=document.createElement('div');frame.className='lohw-welcome-photo';currentHero.before(frame);frame.append(currentHero);}
   const h2=board.querySelector('h2');if(h2){h2.classList.add('lohw-welcome-tagline');h2.innerHTML='Together for a <span>Better Society</span>';}
   const tagline=document.createElement('p');tagline.className='lohw-welcome-points';tagline.textContent='Connect · Donate · Support · Uplift';
   if(h2)h2.after(tagline);
   const sub=board.querySelector(':scope > p:not(.lohw-welcome-points)');if(sub)sub.textContent='A community built around meaningful support.';
 }
}
const existingRender=window.render;if(typeof existingRender==='function'){
 window.render=function(){existingRender();try{applyApprovedDesign()}catch(err){console.warn('Visual enhancement skipped',err)}};
 applyApprovedDesign();
}
})();

#app input:not([type=checkbox]):not([type=radio]),#app select,#app textarea{border:1px solid #dce7f5!important;border-radius:14px!important;min-height:45px!important;background:#fff!important;color:#162c50!important}
#app form{background:#fff;border-radius:23px;padding:16px;border:1px solid #e7edf7;box-shadow:0 8px 20px rgba(14,61,126,.055)}
#app form label{font-size:12px!important;font-weight:700!important;color:#415876!important;margin:10px 0 6px!important}
#app .nav{background:rgba(255,255,255,.97)!important;border:1px solid #e4ecf8!important;box-shadow:0 -8px 28px rgba(25,74,137,.09)!important;border-radius:26px 26px 0 0!important;bottom:0!important;padding:12px 4px max(10px,env(safe-area-inset-bottom))!important;backdrop-filter:blur(15px)!important}
#app .nav button{display:flex!important;align-items:center!important;justify-content:center!important;flex-direction:column!important;color:#6c7f99!important;font-size:10px!important;gap:4px!important;min-height:54px!important;padding:6px 2px!important}
#app .nav button b{display:grid!important;place-items:center!important;width:34px!important;height:32px!important;color:#405f8e!important;font-size:21px!important;border-radius:12px!important}
#app .nav button.active b{background:linear-gradient(155deg,#2d99fb,#0051c5)!important;color:#fff!important;box-shadow:0 5px 14px #0059c64a!important}
#app .nav button.active{color:#0757cf!important;font-weight:800!important}
#app .foot{font-size:10px!important;color:#9aacbe!important;margin-top:35px!important;line-height:1.55!important}
#app .v9skeleton,#app .polish-skeleton{display:none!important}
/* main donor product dashboard inspired by approved 3-phone reference */
#app .approved-donor{display:grid;gap:16px}
#app .approved-donor .product-banner{height:200px;border-radius:24px;background:linear-gradient(125deg,#003eaf,#096fe6 76%,#2998fa);position:relative;overflow:hidden;box-shadow:0 12px 25px #075bc52b}
#app .product-banner:after{content:"";position:absolute;right:-30px;bottom:-90px;width:200px;height:210px;border-radius:50%;background:#ffffff16;box-shadow:-60px -22px 0 #ffffff0a}
#app .product-banner .banner-photo{position:absolute;right:0;bottom:0;top:0;width:52%;height:100%;object-fit:cover;opacity:.85;mask-image:linear-gradient(90deg,transparent,#000 42%)}
#app .product-banner .banner-copy{position:relative;z-index:2;max-width:71%;padding:24px 15px 18px 20px;color:white}
#app .product-banner h2{margin:0!important;font-size:25px!important;color:#fff!important;line-height:1.12!important;letter-spacing:-.035em!important}
#app .product-banner p{font-size:13px!important;margin:8px 0 14px!important;color:#eef5ff!important;line-height:1.35!important}
#app .product-banner button{border:0;border-radius:99px;background:#fff;color:#0546ab;padding:11px 20px;font-size:12px;font-weight:850}
#app .approved-donor .donor-greeting{display:flex;align-items:center;justify-content:space-between;gap:12px}
#app .approved-donor .donor-greeting h1{font-size:24px!important;margin:0!important;letter-spacing:-.04em!important}
#app .approved-donor .donor-greeting span{font-size:13px;color:#617490}
#app .donor-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:#fff;border:1px solid #e3ecf9;border-radius:23px;box-shadow:0 7px 20px #0b4c9e13;padding:17px 6px}
#app .donor-metrics>div{text-align:center;border-right:1px solid #e0eaf7;min-width:0;padding:0 3px}
#app .donor-metrics>div:last-child{border:0}
#app .donor-metrics .metric-glyph{font-size:24px;display:block;height:32px}
#app .donor-metrics strong{display:block;font-size:22px;color:#101b36;letter-spacing:-.04em}
#app .donor-metrics small{color:#5d7090;font-size:11px}
#app .product-shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
#app .product-shortcuts button{border:1px solid #e7edf8;border-radius:20px;background:#fff;padding:15px 5px 13px;box-shadow:0 7px 16px #083d8a12;font-size:11px;font-weight:800;color:#152445;min-height:97px}
#app .product-shortcuts .symbol{font-size:25px;display:block;margin-bottom:8px}
#app .product-heading{display:flex;justify-content:space-between;align-items:center;margin:4px 0 0!important}
#app .product-heading h2{font-size:18px!important;margin:0;color:#152441}
#app .product-heading button{border:none;background:transparent;color:#075cdb;font-weight:750;font-size:12px}
#app .campaign-card{background:#fff;border:1px solid #e7ecf8;box-shadow:0 8px 19px #174a9815;border-radius:22px;display:grid;grid-template-columns:115px minmax(0,1fr);gap:12px;padding:12px;align-items:center}
#app .campaign-card img{width:115px;height:143px;object-fit:cover;border-radius:15px;background:#dce9f7}
#app .campaign-card h3{font-size:14px!important;margin:0 0 9px!important;line-height:1.25!important}
#app .campaign-card .progress{height:8px!important;margin:8px 0}
#app .campaign-card .amount{font-size:12px;font-weight:800;color:#173050;margin-bottom:8px}
#app .campaign-card button{width:100%;border:0;background:linear-gradient(180deg,#148cfd,#0652c9);color:white;border-radius:13px;padding:10px 7px;font-size:12px;font-weight:800}
#app .campaign-hero-image{display:block;width:100%;height:230px;object-fit:cover;border-radius:24px;background:#dfeeff;margin:8px 0 17px;box-shadow:0 8px 20px #1b539c16}
#app .campaign-detail-title{font-size:25px!important;line-height:1.12!important;margin:10px 0!important;letter-spacing:-.045em!important}
#app .campaign-desc{font-size:14px;color:#556b88;line-height:1.65;margin:10px 0 23px}
#app .campaign-category{display:inline-flex;background:#e6f0ff;border-radius:99px;padding:6px 12px;font-size:12px;color:#0758cc;font-weight:800}
#app .campaign-amount-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:#566a8c;margin:18px 0 9px}
#app .campaign-amount-line strong{font-size:20px;color:#15213c}
#app .campaign-detail-progress{height:10px;background:#d9e8ff;border-radius:50px;overflow:hidden}
#app .campaign-detail-progress i{display:block;height:100%;background:linear-gradient(90deg,#238bfc,#0157c9);border-radius:50px}
#app .campaign-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:19px 4px;background:#fff;box-shadow:0 6px 20px #18529a11;border:1px solid #e5edf9;border-radius:22px;margin:22px 0}
#app .campaign-stats>div{text-align:center;border-right:1px solid #e2eafa}
#app .campaign-stats>div:last-child{border:none}
#app .campaign-stats b{font-size:21px;display:block;color:#152241}
#app .campaign-stats span{font-size:11px;color:#617490}
#app .campaign-stats em{display:block;font-style:normal;color:#075dcc;font-size:20px;margin-bottom:5px}
#app .campaign-tabs{display:flex;align-items:center;background:#fff;border-radius:17px;border:1px solid #e8edf8;gap:3px;padding:4px;margin:18px 0}
#app .campaign-tabs button{flex:1;border:0;background:transparent;padding:11px 4px;border-radius:13px;color:#405778;font-size:12px;font-weight:750}
#app .campaign-tabs button[aria-selected=true]{color:white;background:linear-gradient(90deg,#208afa,#0254c9)}
#app .campaign-detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
#app .campaign-detail-actions button{border:0;border-radius:15px;padding:14px 8px;font-weight:800;font-size:12px}
#app .campaign-detail-actions .major{background:linear-gradient(180deg,#188efe,#014bbf);color:white;grid-column:1/-1}
#app .campaign-detail-actions .minor{background:#e9f2ff;color:#0a57ba}
#app .internal-panel-cover{background:linear-gradient(125deg,#0442ba,#1789f0);border-radius:24px;padding:24px 19px;margin:8px 0 19px;color:white;position:relative;overflow:hidden;box-shadow:0 10px 23px #0757c12b}
#app .internal-panel-cover::after{content:"";position:absolute;right:-40px;top:-45px;width:170px;height:170px;background:#ffffff12;border-radius:50%;box-shadow:-52px 90px 0 #ffffff0b}
#app .internal-panel-cover small{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#cde4ff}
#app .internal-panel-cover h2{color:white!important;font-size:24px!important;line-height:1.16!important;margin:6px 0 9px!important;max-width:270px}
#app .internal-panel-cover p{color:#e7f1ff!important;font-size:12px!important;max-width:270px;margin:0!important;line-height:1.5}
#app .approved-explore-card{padding:0!important;overflow:hidden}
#app .approved-explore-card .explore-picture{display:block;height:145px;object-fit:cover;width:100%}
#app .approved-explore-card .explore-body{padding:15px}
#app .approved-explore-card .explore-body h3{font-size:16px!important;margin:0 0 5px}
#app .approved-explore-card .explore-meta{font-size:11px;color:#687b94}
#app .approved-explore-card .explore-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
#app .approved-explore-card .explore-footer button{padding:11px 12px!important;min-height:35px!important;font-size:12px!important}
@media(max-width:375px){#app .campaign-card{grid-template-columns:100px minmax(0,1fr)}#app .campaign-card img{width:100px}#app .product-shortcuts{gap:6px}#app .product-shortcuts button{font-size:10px}#app .product-banner .banner-copy{max-width:77%}}
#app.dark{--bg:#101d34!important;--card:#152540!important;--text:#ebf3ff!important;--line:#2b4466!important;background:#101d34!important}
#app.dark .card,#app.dark .stat,#app.dark .shortcut,#app.dark form{background:#152540!important;border-color:#284468!important}

  function makeCampaign(main){
    const data=getData();if(!data)return;
    let n;
    try{n=typeof getNeed==='function'?getNeed():data.needs.find(x=>x.id===detail)}catch(e){n=data.needs.find(x=>x.id===detail)}
    if(!n||!data.needs.some(x=>x.id===n.id))return;
    const needId=Number(n.id)||101;
    const amt=Number(n.raised)||0,goal=Math.max(1,Number(n.amount)||100000),pct=Math.min(100,Math.round(amt/goal*100));
    const description=textSafe(n.description||'Your contribution helps provide essential resources to people in need.');
    const pic=imageFor();
    const section=document.createElement('section');section.className='approved-campaign-detail';
    section.innerHTML=`<img class="campaign-hero-image" alt="Education campaign" src="${pic}">
       <div class="campaign-category">${textSafe(n.category||'Community Support')}</div>
       <h1 class="campaign-detail-title">${textSafe(n.title)}</h1>
       <p class="campaign-desc">${description}</p>
       <div class="campaign-amount-line"><span><strong>₹${amt.toLocaleString('en-IN')}</strong> of ₹${goal.toLocaleString('en-IN')}</span><strong>${pct}%</strong></div>
       <div class="campaign-detail-progress"><i style="width:${pct}%"></i></div>
       <div class="campaign-stats"><div><em>♧</em><b>${data.donations.filter(d=>d.need===n.id).length}</b><span>Donors</span></div><div><em>◷</em><b>${Math.max(0,Number(n.days)||28)}</b><span>Days Left · demo</span></div><div><em>♟</em><b>${Number(n.count)||0}</b><span>Beneficiaries</span></div></div>
       <div class="campaign-tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-campaign-tab="about">About</button><button type="button" role="tab" aria-selected="false" data-campaign-tab="updates">Updates</button><button type="button" role="tab" aria-selected="false" data-campaign-tab="donors">Donors</button></div>
       <p class="campaign-desc" id="lohw-tab-content">${description}</p>
       <div class="campaign-detail-actions"><button type="button" class="major" onclick="go('DON-05',${needId})">Donate Now →</button><button type="button" class="minor" onclick="go('DON-06',${needId})">Give Goods</button><button type="button" class="minor" onclick="saveCause(${needId})">♡ Save Cause</button></div>`;
    const inner=section.querySelector('#lohw-tab-content');
    section.querySelectorAll('[data-campaign-tab]').forEach(btn=>btn.addEventListener('click',()=>{
      section.querySelectorAll('[data-campaign-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===btn)));
      if(btn.dataset.campaignTab==='about')inner.textContent=n.description||'Campaign information';
      if(btn.dataset.campaignTab==='updates')inner.textContent='Follow this requirement to see its latest verified updates in the demo workflow.';
      if(btn.dataset.campaignTab==='donors')inner.textContent=`${data.donations.filter(d=>d.need===n.id).length} demo donations recorded for this requirement.`;
    }));
    // Preserve original fully functional verification and action content inside expandable detail.
    const old=[];let firstCard=main.querySelector('.card');while(firstCard){old.push(firstCard);firstCard=firstCard.nextElementSibling?.classList.contains('card')?firstCard.nextElementSibling:null}
    const originals=[...main.children].filter(el=>el.classList.contains('card'));
    const fallback=document.createElement('details');fallback.className='lohp-accordion';fallback.innerHTML='<summary>View full verification & contribution options</summary>';
    const body=document.createElement('div');body.className='lohp-original';originals.forEach(el=>body.append(el));fallback.append(body);
    const title=main.querySelector('h1');if(title)title.remove();const sub=main.querySelector(':scope > p');if(sub)sub.remove();
    const back=main.querySelector('.back');if(back)back.after(section);else main.prepend(section);
    const foot=main.querySelector('.foot');if(foot)foot.before(fallback);else main.append(fallback);
  }
  function enhanceInterior(main){
    if(page==='DON-03'){makeCampaign(main);return}
    if(page==='DON-02'){
      main.querySelectorAll('#publicList .card').forEach((c,i)=>{
        c.classList.add('approved-explore-card');const n=(typeof publicNeeds==='function'?publicNeeds():[])[i];
        if(n&&!c.querySelector('.explore-picture')){
          const img=document.createElement('img');img.className='explore-picture';img.alt='Requirement photo';img.src=imageFor();c.prepend(img);
        }
      });
    }
    if(page===homeKey() && role!=='DON'){
      const h=main.querySelector(':scope > h1');
      const p=main.querySelector(':scope > p');
      const title=h?.textContent||({NGO:'NGO Overview',REQ:'My Requirements',ADM:'Platform Overview'}[role]);
      const copy=p?.textContent||'All essential information in one place.';
      if(h)h.remove();if(p)p.remove();
      const cover=document.createElement('section');cover.className='internal-panel-cover';cover.innerHTML=`<small>${textSafe(panels[role]||'LOHWS')} Workspace</small><h2>${textSafe(title)}</h2><p>${textSafe(copy)}</p>`;
      main.prepend(cover);
    }
  }
  function transform(){
    if(typeof stage==='undefined'||stage!=='app')return;
    const main=document.querySelector('#app main');if(!main)return;
    if(role==='DON'&&page===homeKey())makeHome(main);else enhanceInterior(main);
  }
  window.render=function(){prior();try{transform()}catch(e){console.warn('LOHWS interior visual layer:',e)}};
  try{transform()}catch(e){console.warn(e)}
})();
</script>

<script id="loh-governance-accessible-2026">
(function(){
 const routes = [
  ['ADM-02','NGO Verification','shield'],
  ['ADM-03','User & Access Governance','user'],
  ['ADM-04','Requirement Escalations','flag'],
  ['ADM-05','Campaign Moderation','message'],
  ['ADM-06','Payment Operations','wallet'],
  ['ADM-07','Complaints & Safeguarding','warning'],
  ['ADM-10','Audit & Security','file'],
  ['ADM-11','Reports & Configuration','chart']
 ];
 const extras=[['ADM-08','Taxonomy & Locations','file'],['ADM-09','Notifications & Templates','bell']];
 function card([route,label,icon]){
  return '<button type="button" class="loh-gov-card" data-governance-route="'+route+'" aria-label="Open '+label.replace(/&/g,'and')+'" onclick="go(\''+route+'\')">'+
   '<span class="loh-gov-icon">'+ico(icon)+'</span><span class="loh-gov-text">'+label+'</span></button>';
 }
 function decorate(){
  const app=document.querySelector('#app');
  if(!app||!app.classList.contains('role-adm')||typeof page==='undefined'||page!=='ADM-01')return;
  const main=app.querySelector('main');
  if(!main||main.querySelector('.loh-governance'))return;
  // Replace only the existing admin Quick actions and its compact feature drawer; keep routes and workflows.
  const quickHeading=[...main.querySelectorAll('.section h2')].find(n=>n.textContent.trim().toLowerCase()==='quick actions');
  const quickBlock=quickHeading?.closest('.section');
  const quickGrid=quickBlock?.nextElementSibling;
  const anchor=quickBlock||main.querySelector('.adm-feature-more');
  const wrap=document.createElement('section');
  wrap.className='loh-governance';
  wrap.setAttribute('aria-label','Governance queues');
  wrap.innerHTML='<h2>Governance queues</h2><div class="loh-gov-grid">'+routes.map(card).join('')+'</div>'+
  '<details class="loh-extra-tools"><summary>More admin tools <span>2 more options ⌄</span></summary><div class="loh-extra-grid">'+extras.map(card).join('')+'</div></details>';
  if(anchor)anchor.parentNode.insertBefore(wrap,anchor);
  else main.prepend(wrap);
  if(quickBlock){quickBlock.remove();if(quickGrid?.classList.contains('grid'))quickGrid.remove();}
  main.querySelectorAll('.adm-feature-more,.adm-more-tools').forEach(el=>el.remove());
 }
 const previous=render;
 render=function(...args){const ret=previous.apply(this,args);decorate();return ret};
 decorate();
})();
</script>

<script id="lohws-role-click-reliability">
/* Prevent selection being lost if layered UI handlers re-render a role card on tap. */
(function(){
  const keys={don:'DON',ngo:'NGO',req:'REQ',adm:'ADM'};
  function selectRoleOnInteraction(event){
    let el=event.target;
    if(!(el instanceof Element))return;
    const btn=el.closest('button.rolechoice');
    if(!btn || !document.getElementById('app')?.contains(btn))return;
    if(typeof stage==='undefined'||stage!=='roles')return;
    const key=Object.keys(keys).find(k=>btn.classList.contains(k));
    if(!key)return;
    chosen=keys[key];
    const group=btn.parentNode;
    group.querySelectorAll('button.rolechoice').forEach(c=>{
      const active=c===btn;
      c.classList.toggle('selected',active);
      c.setAttribute('aria-pressed',String(active));
    });
  }
  document.addEventListener('pointerdown',selectRoleOnInteraction,true);
  document.addEventListener('click',selectRoleOnInteraction,true);
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' ')selectRoleOnInteraction(e);
  },true);
})();
</script>
